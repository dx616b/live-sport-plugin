services:
  nuvio:
    build: .
    container_name: nuvio-live-sports
    ports:
      - "7700:7000"
    environment:
      - PORT=7000
      - ADDON_URL=https://nuvio-streams.electron.al
      - PREWARM_MAX_MATCHES=4
      - PREWARM_MAX_CONCURRENT_MATCHES=1
      # If you are hosting this on a public VPS, uncomment the line below and set your domain or IP
      # - ADDON_URL=https://your-domain.example
    restart: unless-stopped
    # node:22-slim has no curl; use the runtime's own fetch. A wedged event loop
    # stops answering here, which Docker then reports as unhealthy.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7000/health',{signal:AbortSignal.timeout(5000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 60s
      timeout: 8s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 2g
    cpus: 2.0
