name: Reliability regressions

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/reliability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolver-and-playback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --include=dev
      - name: Resolver fallback, outbound security and playback regressions
        env:
          APP_SECRET: ci-only-non-production-signing-key
        run: >-
          node node_modules/jest/bin/jest.js --runInBand
          --runTestsByPath
          tests/daddyLiveIframeIsolation.test.js
          tests/daddyliveEmbedScan.test.js
          tests/daddyLiveProvider.test.js
          tests/daddyLiveMediaCheck.test.js
          tests/daddyLiveMediaRecovery.test.js
          tests/outboundDnsCache.test.js
          tests/guardedOutbound.test.js
          tests/guardedOutboundTransport.test.js
          tests/streamResolveDeadBackoff.test.js
          tests/hlsPlainHttpSegments.test.js
          tests/hlsRewritePlaylist.test.js
          tests/manifestHlsTagUris.test.js
          tests/byteRangeSigner.test.js
          tests/byteRangeSignerAvailability.test.js
          tests/byteRangeSignerSecret.test.js
