name: Reliability regressions

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'package*.json'
      - 'resolver/**'
      - 'Dockerfile'
      - '.github/workflows/reliability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolver-and-playback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --include=dev
      - run: npm ci --prefix resolver --ignore-scripts
      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --audit-level=low
          npm audit --prefix resolver --omit=dev --audit-level=low
      - name: Prepare pinned timezone data
        run: npm run timezone:prepare
      - name: Full regression suite
        env:
          APP_SECRET: ci-only-non-production-signing-key
          ICU_TIMEZONE_FILES_DIR: ${{ github.workspace }}/.timezone-data/2026f-le
        run: node node_modules/jest/bin/jest.js --runInBand
